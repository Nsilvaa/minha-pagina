
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reflexo Arcade</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- BOTÃO VOLTAR -->
        <button type="button" id="back-button" hidden>
            ← VOLTAR
        </button>

        <!-- CABEÇALHO -->
        <header>
            <h1>REFLEXO ARCADE</h1>
            <p>TESTE SUA VELOCIDADE!</p>
        </header>

        <!-- PONTUAÇÃO -->
        <section class="stats">

            <div class="stat-box">
                <span>PONTUAÇÃO</span>
                <strong id="score">0</strong>
            </div>

            <div class="stat-box">
                <span>TEMPO</span>
                <strong id="time">30</strong>
            </div>

            <div class="stat-box">
                <span>RECORDE</span>
                <strong id="record">0</strong>
            </div>

        </section>

        <!-- ÁREA DO JOGO -->
        <section class="game-area" id="game-area">

            <!-- TELA INICIAL -->
            <div class="start-screen" id="start-screen">

                <h2>READY PLAYER?</h2>

                <p>Clique nos alvos antes que o tempo acabe!</p>

                <h3>ESCOLHA A DIFICULDADE</h3>

                <div class="difficulty-options">

                    <button
                        type="button"
                        class="difficulty"
                        data-speed="1500"
                        aria-pressed="false">
                        FÁCIL
                    </button>

                    <button
                        type="button"
                        class="difficulty selected"
                        data-speed="900"
                        aria-pressed="true">
                        MÉDIO
                    </button>

                    <button
                        type="button"
                        class="difficulty"
                        data-speed="400"
                        aria-pressed="false">
                        DIFÍCIL
                    </button>

                </div>

                <p id="difficulty-status">
                    ✓ Dificuldade selecionada: MÉDIO
                </p>

                <button type="button" id="start-button">
                    INICIAR JOGO
                </button>

            </div>

            <!-- ALVO -->
            <button
                type="button"
                class="target"
                id="target"
                hidden>
                ⚡
            </button>

            <!-- TELA FINAL -->
            <div class="end-screen" id="end-screen" hidden>

                <h2>GAME OVER!</h2>

                <p>Sua pontuação foi:</p>

                <strong id="final-score">0</strong>

                <button type="button" id="restart-button">
                    JOGAR NOVAMENTE
                </button>

            </div>

        </section>

        <!-- RODAPÉ -->
        <footer>
            <p>ARCADE 2026 • INSERT COIN TO PLAY</p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>

</html>
